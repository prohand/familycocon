# Publication d'une version : pousser un tag « vX.Y.Z » (ex. v0.1.0).
#   - image ghcr.io/<propriétaire>/familycocon:X.Y.Z (+ :latest pour une
#     version finale, pas pour une préversion « -rc1 »), amd64 et arm64 ;
#   - Release GitHub avec les binaires linux/amd64 et linux/arm64.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.4

jobs:
  verification:
    name: Contrôles et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: make verif
      - run: go test -race ./...

  image:
    name: Image Docker publiée
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes (X.Y.Z, et latest pour une version finale)
        id: etiquettes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          proprio=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/$proprio/familycocon"
          tags="$base:$version"
          if [ "${version#*-}" = "$version" ]; then tags="$tags,$base:latest"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Construction et publication
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Pas de cache pour une version publiée.
          no-cache: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          build-args: |
            VERSION=${{ steps.etiquettes.outputs.version }}
            COMMIT=${{ github.sha }}

  release:
    name: Release GitHub (binaires)
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Binaires
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          make binaires VERSION="${TAG#v}"
          cd dist && sha256sum familycocon-* > SHA256SUMS
      - name: Publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          pre=""
          if [ "${TAG#*-}" != "$TAG" ]; then pre="--prerelease"; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "FamilyCocon $TAG" --generate-notes $pre

# CI de FamilyCocon : à chaque push sur une branche, contrôles, tests et
# construction de l'image Docker (amd64 + arm64), sans rien publier.
# Les versions (tags v*) sont publiées par release.yml.
name: CI

on:
  push:
    branches: ['**']
    # La documentation seule ne relance rien.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.4
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  controles:
    name: Formatage, Vet, SQL, Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatage, Go vet, code SQL généré à jour
        run: make verif
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests (accès concurrents compris)
        run: go test -race ./...

  image:
    name: Image Docker (amd64 + arm64, non publiée)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Construction
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

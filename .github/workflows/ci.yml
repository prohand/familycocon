# CI de FamilyCocon : à chaque push sur une branche, contrôles, tests et
# construction de l'image Docker (amd64 + arm64), sans rien publier.
# Les versions (tags v*) sont publiées par release.yml.
name: CI

on:
  push:
    branches: ['**']
    # La documentation seule ne relance rien.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.4
  GOVULNCHECK_VERSION: v1.9.0
  SQLC_VERSION: v1.31.1

jobs:
  controles:
    name: Formatage, Vet, SQL, Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      # sqlc et govulncheck : compilés une seule fois puis gardés en cache
      # (sqlc compile du C : plus d'une minute à chaque fois sans cache).
      - name: Cache des outils (sqlc, govulncheck)
        id: outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/outils
          key: outils-${{ runner.os }}-${{ env.GOTOOLCHAIN }}-sqlc-${{ env.SQLC_VERSION }}-govulncheck-${{ env.GOVULNCHECK_VERSION }}
      - name: Installation des outils (si pas en cache)
        if: steps.outils.outputs.cache-hit != 'true'
        run: |
          GOBIN="$HOME/outils" go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
          GOBIN="$HOME/outils" go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Formatage, Go vet, code SQL généré à jour
        run: make verif SQLC="$HOME/outils/sqlc"
      - name: Govulncheck
        run: ~/outils/govulncheck ./...

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Tests (accès concurrents compris)
        run: go test -race ./...

  # L'image ne dépend que du Dockerfile et des dépendances Go : elle n'est
  # reconstruite que si l'un d'eux change, et toujours sur main (le code
  # lui-même est déjà compilé et testé par les deux autres jobs).
  image:
    name: Image Docker (amd64 + arm64, non publiée)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Faut-il reconstruire l'image ?
        id: besoin
        env:
          AVANT: ${{ github.event.before }}
          REF: ${{ github.ref }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -eu
          construire=oui
          if [ "$REF" != "refs/heads/main" ] && [ "$EVENEMENT" = "push" ] \
             && [ -n "$AVANT" ] && ! echo "$AVANT" | grep -q '^0*$' && git cat-file -e "$AVANT" 2>/dev/null; then
            if ! git diff --name-only "$AVANT" HEAD | grep -qE '^(Dockerfile|\.dockerignore|go\.mod|go\.sum|\.github/workflows/)'; then
              construire=non
            fi
          fi
          echo "Reconstruire l'image : $construire"
          echo "construire=$construire" >> "$GITHUB_OUTPUT"
      - if: steps.besoin.outputs.construire == 'oui'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construction
        if: steps.besoin.outputs.construire == 'oui'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # Cache des couches (image Go, modules téléchargés) entre deux CI.
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,scope=ci-image,mode=max
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

{{define "contenu"}}
{{$c := .C}}
{{with .Donnees}}
<section class="titre-page">
  <a class="retour" href="{{if .Nouveau}}/prestataires{{else}}/prestataires/{{.P.ID}}{{end}}">‹ Retour</a>
  <h1>{{if .Nouveau}}🧰 Nouveau prestataire{{else}}✏️ {{.P.Nom}}{{end}}</h1>
</section>
<form class="carte" method="post" action="{{if .Nouveau}}/prestataires{{else}}/prestataires/{{.P.ID}}{{end}}">
  {{template "jeton" $c.CSRF}}
  <label class="champ"><span>Nom</span><input name="nom" value="{{.P.Nom}}" maxlength="80" placeholder="Ex. : Plomberie Martin" required autofocus></label>
  <label class="champ"><span>Métier</span><input name="metier" value="{{.P.Metier}}" list="metiers" maxlength="60"></label>
  <datalist id="metiers">{{range .Metiers}}<option value="{{.}}">{{end}}</datalist>
  <div class="rangee">
    <label class="champ"><span>Téléphone</span><input type="tel" name="telephone" value="{{.P.Telephone}}" maxlength="30"></label>
    <label class="champ"><span>E-mail</span><input type="email" name="email" value="{{.P.Email}}" maxlength="120"></label>
  </div>
  <label class="champ"><span>Adresse</span><textarea name="adresse" rows="2" maxlength="300">{{.P.Adresse}}</textarea></label>
  <label class="champ"><span>Site web</span><input name="site" value="{{.P.Site}}" maxlength="200" inputmode="url"></label>
  <label class="champ"><span>Notes (tarifs, horaires…)</span><textarea name="notes" rows="2" maxlength="1000">{{.P.Notes}}</textarea></label>
  <div class="boutons"><button class="bouton">Enregistrer</button></div>
</form>
{{end}}
{{end}}

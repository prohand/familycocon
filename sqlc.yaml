# Génération du code d'accès à la base (sqlc) : chaque requête SQL de
# internal/donnees/requetes/ est vérifiée contre le schéma (les migrations),
# puis transformée en fonction Go typée. Après une modification : make sql
version: "2"
sql:
  - engine: sqlite
    schema: internal/base/migrations
    queries: internal/donnees/requetes
    gen:
      go:
        package: donnees
        out: internal/donnees
        emit_empty_slices: true
        emit_methods_with_db_argument: false
        output_files_suffix: _gen
        output_db_file_name: db_gen.go
        output_models_file_name: modeles_gen.go
        # Noms au singulier que sqlc ne sait pas deviner en français.
        rename:
          tach: Tache
          taches_faite: TacheFaite
          repa: Repas
          missions_faite: MissionFaite
          animaux: Animal
          garanty: Garantie
          photos_note: PhotoNote
          etoiles_bonu: EtoilesBonus
          evenements_exception: EvenementsException

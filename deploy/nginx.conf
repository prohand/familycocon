# FamilyCocon derrière Nginx (exemple). Le conteneur écoute sur
# 127.0.0.1:8080 (voir docker-compose.yml). Dans .env :
#   FC_URL_PUBLIQUE=https://famille.exemple.fr
#   FC_PROXYS=172.16.0.0/12        (Nginx vu depuis le conteneur : passerelle Docker)

server {
    listen 80;
    listen [::]:80;
    server_name famille.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name famille.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/famille.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/famille.exemple.fr/privkey.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Obligatoire : FamilyCocon compare l'en-tête Host à l'origine des
        # requêtes (protection CSRF).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Import d'un carnet d'adresses (.vcf) : jusqu'à 8 Mio, envoi parfois lent.
    location = /contacts/import {
        client_max_body_size 8m;
        client_body_timeout 180s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temps réel (Server-Sent Events) : connexion longue, sans tampon.
    location = /direct {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
